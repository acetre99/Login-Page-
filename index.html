<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-center text-gray-800">मेरे बच्चे पुनः आगमन पर तुम्हारा स्वागत है</h2>
    <form class="space-y-5" action="/login" method="POST">
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-600" for="email">Email</label>
        <input type="email" id="email" name="email" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label class="block mb-1 text-sm font-medium text-gray-600" for="password">Password</label>
        <input type="password" id="password" name="password" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center">
          <input type="checkbox" class="mr-2" />
          Remember me
        </label>
        <a href="#" class="text-blue-500 hover:underline">Password भूल गया ?</a>
      </div>
      <button type="Please Login Me"
        class="w-full px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition">
        Login
      </button>
    </form>
    <p class="text-sm text-center text-gray-600">
      Don't have an account?
      <a href="/signup" class="text-blue-500 hover:underline">Sign up</a>
    </p>
  </div>
</body>
</html>
